name: LIC RAG Platform - CI/CD & GCP Cloud Run Deployment

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v

  deploy-gcp:
    name: Provision & Deploy to GCP Cloud Run
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init & Apply
        working-directory: ./terraform
        run: |
          terraform init
          terraform apply -auto-approve -var="project_id=${{ secrets.GCP_PROJECT_ID }}"

      - name: Build & Push Docker Image via Cloud Build
        run: |
          gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/rag-api:latest .

      - name: Deploy API Server & Streamlit UI to Cloud Run
        run: |
          gcloud run deploy lic-rag-api-prod \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/rag-api:latest \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated \
            --max-instances 5 \
            --set-env-vars GCP_PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}",GCP_REGION="asia-south1",GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
